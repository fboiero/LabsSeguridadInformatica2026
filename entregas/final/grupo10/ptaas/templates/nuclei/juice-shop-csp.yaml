id: juice-shop-csp
info:
  name: Juice Shop missing CSP
  author: grupo10
  severity: low
  description: Missing Content-Security-Policy header.
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: dsl
        dsl:
          - "status_code == 200 && !contains(tolower(header), 'content-security-policy')"
