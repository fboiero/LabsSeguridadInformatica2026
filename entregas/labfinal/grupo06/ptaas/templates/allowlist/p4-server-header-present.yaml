id: p4-server-header-present
info:
  name: Cabecera Server presente
  author: grupo06-p4-propuesta
  severity: info
  description: Detección informativa. No confirma vulnerabilidad; requiere revisión.
  tags: tech
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  redirects: false
  max-redirects: 0
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: dsl
    dsl:
    - contains(tolower(all_headers), "server:")
