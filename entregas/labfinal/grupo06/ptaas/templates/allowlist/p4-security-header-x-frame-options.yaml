id: p4-security-header-x-frame-options
info:
  name: Ausencia de X-Frame-Options
  author: grupo06-p4-propuesta
  severity: info
  description: Detección informativa. No confirma vulnerabilidad; requiere revisión.
  tags: headers
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  redirects: false
  max-redirects: 0
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: dsl
    dsl:
    - '!contains(tolower(all_headers), "x-frame-options:")'
