id: p4-security-header-csp
info:
  name: Ausencia de Content-Security-Policy
  author: grupo06-p4-propuesta
  severity: info
  description: Detección informativa. No confirma vulnerabilidad; requiere revisión.
  tags: misconfig
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  redirects: false
  max-redirects: 0
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: dsl
    dsl:
    - '!contains(tolower(all_headers), "content-security-policy:")'
